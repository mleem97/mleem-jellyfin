name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Validate Python release scripts
        run: python -m compileall -q .github/scripts
      - name: Test release tooling
        run: python -m unittest discover -s tests/release-tooling -v
      - name: Validate plugin metadata and catalog
        run: python .github/scripts/validate_repository.py
      - name: Restore repository solution
        run: dotnet restore Jellyfin.Plugins.sln --locked-mode
      - name: Build repository solution
        run: dotnet build Jellyfin.Plugins.sln -c Release --no-restore
      - name: Run plugin tests
        run: dotnet test Jellyfin.Plugins.sln -c Release --no-restore --no-build --logger "console;verbosity=normal"
      - name: Run HDD Display dashboard smoke test
        working-directory: tests/dashboard-widget
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Run music view regression tests
        working-directory: tests/music-suite
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Smoke-test release packages
        run: python .github/scripts/package_smoke_test.py
