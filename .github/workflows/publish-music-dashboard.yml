name: Publish Music Dashboard

on:
  push:
    tags:
      - 'MusicDashboard-v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build
        run: dotnet build plugins/MusicDashboard/MusicDashboard.csproj -c Release
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#MusicDashboard-v}"
          mkdir -p release-assets package
          cp plugins/MusicDashboard/bin/Release/net9.0/Jellyfin.Plugin.MusicDashboard.dll package/
          zip -j "release-assets/MusicDashboard_${VERSION}.zip" package/*
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-dashboard-package
          path: release-assets/
