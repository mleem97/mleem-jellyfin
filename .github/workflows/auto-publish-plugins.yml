name: Auto Publish Plugins

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin slug to publish'
        required: true
        type: choice
        options:
          - HddDisplay
          - BetterMusicDisplay
          - MusicHoarderzProvider
      bump:
        description: 'Version bump when no exact version is supplied'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
          - revision
      release_version:
        description: 'Optional exact four-part version, for example 0.1.0.0'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: plugin-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Validate release scripts
        run: python -m py_compile .github/scripts/auto_publish_plugins.py .github/scripts/publish_plugins.py .github/scripts/release_validation.py
      - name: Build, validate, package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN: ${{ inputs.plugin }}
          VERSION_BUMP: ${{ inputs.bump }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python .github/scripts/publish_plugins.py
