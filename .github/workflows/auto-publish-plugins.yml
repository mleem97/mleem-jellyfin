name: Auto Publish Plugins

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin slug from plugins/<Slug>/plugin.json to publish'
        required: true
        type: string
      bump:
        description: 'Version bump when no exact version is supplied'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
          - revision
      release_version:
        description: 'Optional exact four-part version, for example 0.1.0.0'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: plugin-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Validate release scripts
        run: |
          python -m compileall -q .github/scripts
          python -m unittest discover -s tests/release-tooling -v
          python .github/scripts/validate_repository.py
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Run repository tests before publishing
        run: |
          dotnet restore Jellyfin.Plugins.sln --locked-mode
          dotnet test Jellyfin.Plugins.sln -c Release --no-restore
          npm ci --prefix tests/dashboard-widget --no-audit --no-fund
          npm test --prefix tests/dashboard-widget
          npm ci --prefix tests/music-suite --no-audit --no-fund
          npm test --prefix tests/music-suite
      - name: Build, validate, package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN: ${{ inputs.plugin }}
          VERSION_BUMP: ${{ inputs.bump }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python .github/scripts/publish_plugins.py
