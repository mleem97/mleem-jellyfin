name: Music Dashboard Build

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/MusicDashboard/**'
      - '.github/workflows/build-music-dashboard.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'plugins/MusicDashboard/**'
      - '.github/workflows/build-music-dashboard.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore plugins/MusicDashboard/MusicDashboard.csproj
      - name: Build
        run: dotnet build plugins/MusicDashboard/MusicDashboard.csproj -c Release --no-restore
