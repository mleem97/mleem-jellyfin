name: Build MusicToolkit

on:
  push:
    branches: [main, dev]
    paths:
      - 'plugins/MusicToolkit/**'
      - 'tests/MusicToolkit.Tests/**'
      - '.github/scripts/**'
      - 'Directory.*.props'
      - 'Directory.*.targets'
      - 'global.json'
      - 'tools/**'
      - 'dependencies/**'
      - 'external/**'
      - '.gitmodules'
      - '.github/workflows/build-plugin.yml'
  pull_request:
    paths:
      - 'plugins/MusicToolkit/**'
      - 'tests/MusicToolkit.Tests/**'
      - '.github/scripts/**'
      - 'Directory.*.props'
      - 'Directory.*.targets'
      - 'global.json'
      - 'tools/**'
      - 'dependencies/**'
      - 'external/**'
      - '.gitmodules'
      - '.github/workflows/build-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore tests/MusicToolkit.Tests/MusicToolkit.Tests.csproj --locked-mode
      - name: Build Release
        run: dotnet build tests/MusicToolkit.Tests/MusicToolkit.Tests.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/MusicToolkit.Tests/MusicToolkit.Tests.csproj -c Release --no-build --no-restore
      - name: Validate package
        run: python .github/scripts/package_smoke_test.py --plugin MusicToolkit --output artifacts
      - name: Upload validated development package
        uses: actions/upload-artifact@v4
        with:
          name: MusicToolkit-test-${{ github.sha }}
          path: artifacts/*.zip
          if-no-files-found: error
