name: Build Plugins

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plugins.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover and validate plugin metadata
        id: plugins
        run: |
          matrix=$(python .github/scripts/validate_repository.py --matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: Build ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore "plugins/${{ matrix.plugin }}/${{ matrix.plugin }}.csproj" --locked-mode
      - name: Build
        run: dotnet build "plugins/${{ matrix.plugin }}/${{ matrix.plugin }}.csproj" -c Release --no-restore
      - name: Validate package
        run: python .github/scripts/package_smoke_test.py --plugin "${{ matrix.plugin }}" --output artifacts
      - name: Upload validated development package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-${{ github.sha }}
          path: artifacts/*.zip
          if-no-files-found: error
