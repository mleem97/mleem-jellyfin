name: MusicToolkit Test Suite

on:
  push:
    branches: [main, dev]
    paths:
      - 'plugins/MusicToolkit/**'
      - 'tests/MusicToolkit.Tests/**'
      - '.github/workflows/test-suite.yml'
      - 'Directory.*.props'
      - 'Directory.*.targets'
      - 'global.json'
      - 'tools/**'
      - 'dependencies/**'
      - 'external/**'
      - '.gitmodules'
  pull_request:
    paths:
      - 'plugins/MusicToolkit/**'
      - 'tests/MusicToolkit.Tests/**'
      - '.github/workflows/test-suite.yml'
      - 'Directory.*.props'
      - 'Directory.*.targets'
      - 'global.json'
      - 'tools/**'
      - 'dependencies/**'
      - 'external/**'
      - '.gitmodules'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore tests/MusicToolkit.Tests/MusicToolkit.Tests.csproj --locked-mode
      - name: Test with coverage
        run: dotnet test tests/MusicToolkit.Tests/MusicToolkit.Tests.csproj -c Release --no-restore --collect:"XPlat Code Coverage"
