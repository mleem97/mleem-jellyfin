name: MusicToolkit Test Suite

on:
  push:
    branches: [main]
    paths:
      - 'plugins/MusicToolkit/**'
      - 'tests/MusicToolkit.Tests/**'
  pull_request:
    paths:
      - 'plugins/MusicToolkit/**'
      - 'tests/MusicToolkit.Tests/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore tests/MusicToolkit.Tests/MusicToolkit.Tests.csproj
      - name: Test with coverage
        run: dotnet test tests/MusicToolkit.Tests/MusicToolkit.Tests.csproj -c Release --collect:"XPlat Code Coverage"
