name: Jellyfin Plugin Repository

on:
  push:
    branches:
      - master
      - main
    tags:
      - '*-v*'
  pull_request:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin folder slug, for example HddDisplay'
        required: true
        default: 'HddDisplay'
      version:
        description: 'Release version without v. Defaults to plugins/<slug>/plugin.json version.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Plugins.sln

      - name: Build all plugins
        run: dotnet build Jellyfin.Plugins.sln -c Release --no-restore

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve plugin metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event_name = os.environ.get('GITHUB_EVENT_NAME', '')
          ref_name = os.environ.get('GITHUB_REF_NAME', '')
          input_plugin = '${{ github.event.inputs.plugin }}'.strip()
          input_version = '${{ github.event.inputs.version }}'.strip()

          if event_name == 'workflow_dispatch':
              plugin_slug = input_plugin or 'HddDisplay'
              version_override = input_version
          else:
              if '-v' not in ref_name:
                  raise SystemExit(f'Release tags must use <PluginSlug>-v<version>, got: {ref_name}')
              plugin_slug, version_override = ref_name.split('-v', 1)

          metadata_path = Path('plugins') / plugin_slug / 'plugin.json'
          if not metadata_path.exists():
              raise SystemExit(f'Missing plugin metadata: {metadata_path}')

          metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          version = version_override or metadata.get('version')
          if not version:
              raise SystemExit('Version could not be resolved.')

          tag_name = f'{plugin_slug}-v{version}'
          package_prefix = metadata.get('packagePrefix') or plugin_slug
          zip_name = f'{package_prefix}_{version}.zip'
          release_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag_name}/{zip_name}"

          env = {
              'PLUGIN_SLUG': plugin_slug,
              'PLUGIN_GUID': metadata['guid'],
              'PLUGIN_NAME': metadata['name'],
              'PLUGIN_PROJECT': metadata['project'],
              'PLUGIN_PACKAGE_PREFIX': package_prefix,
              'PLUGIN_ASSEMBLY': metadata['assembly'],
              'PLUGIN_FRAMEWORK': metadata['framework'],
              'PLUGIN_TARGET_ABI': metadata['targetAbi'],
              'PLUGIN_CATEGORY': metadata.get('category', 'General'),
              'PLUGIN_OWNER': metadata.get('owner', os.environ.get('GITHUB_REPOSITORY_OWNER', '')),
              'PLUGIN_OVERVIEW': metadata.get('overview', metadata['name']),
              'PLUGIN_DESCRIPTION': metadata.get('description', metadata['name']),
              'VERSION': version,
              'TAG_NAME': tag_name,
              'ZIP_NAME': zip_name,
              'RELEASE_URL': release_url,
          }

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as github_env:
              for key, value in env.items():
                  github_env.write(f'{key}={value}\n')
          PY

      - name: Create local release tag for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git fetch --tags --force
          if git rev-parse "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag already exists: ${TAG_NAME}"
          else
            git tag "${TAG_NAME}"
          fi

      - name: Restore plugin
        run: dotnet restore "${PLUGIN_PROJECT}"

      - name: Build plugin
        run: dotnet build "${PLUGIN_PROJECT}" -c Release --no-restore

      - name: Generate changelog
        shell: bash
        run: |
          PREV_TAG="$(git tag --sort=-creatordate | grep "^${PLUGIN_SLUG}-v" | grep -Fxv "${TAG_NAME}" | head -n1 || true)"
          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..${TAG_NAME}"
          else
            RANGE="${TAG_NAME}"
          fi

          CHANGES="$(git log ${RANGE} --pretty=format:'- %s (%h)' -- "plugins/${PLUGIN_SLUG}" .github/workflows/release-plugin.yml manifest.json || true)"
          if [ -z "${CHANGES}" ]; then
            CHANGES='- Maintenance updates.'
          fi

          {
            echo 'CHANGELOG_TEXT<<EOF'
            echo "${CHANGES}"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Create zip package
        shell: bash
        run: |
          rm -rf package release-assets
          mkdir -p package release-assets
          OUTPUT_DIR="$(dirname "${PLUGIN_PROJECT}")/bin/Release/${PLUGIN_FRAMEWORK}"
          cp "${OUTPUT_DIR}/${PLUGIN_ASSEMBLY}" package/
          if [ -f "${OUTPUT_DIR}/${PLUGIN_ASSEMBLY%.dll}.pdb" ]; then
            cp "${OUTPUT_DIR}/${PLUGIN_ASSEMBLY%.dll}.pdb" package/
          fi
          rm -f "${ZIP_NAME}"
          zip -j "${ZIP_NAME}" package/*
          cp "${ZIP_NAME}" release-assets/

      - name: Generate release manifest
        shell: bash
        run: |
          CHECKSUM="$(md5sum "${ZIP_NAME}" | awk '{print toupper($1)}')"
          cat > release-assets/changelog.md <<EOF
          # ${PLUGIN_NAME} ${TAG_NAME}

          ${CHANGELOG_TEXT}
          EOF

          CHECKSUM="$CHECKSUM" python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          with open('manifest.json', 'r', encoding='utf-8') as f:
              manifest = json.load(f)

          plugin_guid = os.environ['PLUGIN_GUID']
          plugin = next((p for p in manifest if p.get('guid') == plugin_guid), None)
          if plugin is None:
              plugin = {'guid': plugin_guid, 'versions': []}
              manifest.append(plugin)

          plugin['name'] = os.environ['PLUGIN_NAME']
          plugin['description'] = os.environ['PLUGIN_DESCRIPTION']
          plugin['overview'] = os.environ['PLUGIN_OVERVIEW']
          plugin['owner'] = os.environ['PLUGIN_OWNER']
          plugin['category'] = os.environ['PLUGIN_CATEGORY']

          existing_versions = plugin.get('versions') or []
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          version = os.environ['VERSION']

          new_version = {
              'version': version,
              'changelog': os.environ.get('CHANGELOG_TEXT', f"Release {os.environ['TAG_NAME']}"),
              'targetAbi': os.environ['PLUGIN_TARGET_ABI'],
              'sourceUrl': os.environ['RELEASE_URL'],
              'checksum': os.environ['CHECKSUM'],
              'timestamp': now
          }

          plugin['versions'] = [new_version] + [v for v in existing_versions if v.get('version') != version]

          with open('release-assets/manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write('\n')
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_SLUG }}-plugin-package
          path: release-assets/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.PLUGIN_NAME }} ${{ env.VERSION }}
          body: ${{ env.CHANGELOG_TEXT }}
          files: |
            release-assets/${{ env.ZIP_NAME }}
            release-assets/manifest.json
            release-assets/changelog.md
          generate_release_notes: false

      - name: Update repository manifest
        shell: bash
        run: |
          git fetch origin "${DEFAULT_BRANCH}"
          git checkout "${DEFAULT_BRANCH}"
          cp release-assets/manifest.json manifest.json

          if git diff --quiet -- manifest.json; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update ${PLUGIN_SLUG} manifest for ${TAG_NAME} release"
          git push origin "${DEFAULT_BRANCH}"
