name: Jellyfin Plugin Library

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore Jellyfin.Plugins.sln
      - name: Build
        run: dotnet build Jellyfin.Plugins.sln -c Release --no-restore
