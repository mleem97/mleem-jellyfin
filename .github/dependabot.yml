version: 2
updates:
  # Fetch and update latest `nuget` pkgs
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    groups:
      jellyfin-api:
        patterns:
          - Jellyfin.*
      test-tooling:
        patterns:
          - Microsoft.NET.Test.Sdk
          - xunit*
          - coverlet.collector
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - chore
      - dependency
      - nuget
    commit-message:
      prefix: chore
      include: scope

  # Fetch and update latest `github-actions` pkgs
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    labels:
      - ci
      - dependency
      - github_actions
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directories:
      - /tests/dashboard-widget
      - /tests/music-suite
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      browser-test-dependencies:
        patterns:
          - '*'
    commit-message:
      prefix: test
      include: scope
