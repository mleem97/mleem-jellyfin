<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Spotify Cover &amp; Metadata Provider</title>
</head>
<body>
<div id="spotifyConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <h2>Spotify Cover &amp; Metadata Provider</h2>
            <form id="spotifyConfigForm">
                <div class="inputContainer">
                    <label class="inputLabel" for="spotifyClientId">Spotify Client-ID</label>
                    <input is="emby-input" type="text" id="spotifyClientId" />
                </div>
                <div class="inputContainer">
                    <label class="inputLabel" for="spotifyClientSecret">Spotify Client-Secret</label>
                    <input is="emby-input" type="password" id="spotifyClientSecret" />
                </div>
                <div class="inputContainer">
                    <label class="inputLabel" for="spotifyMarket">Market</label>
                    <input is="emby-input" type="text" id="spotifyMarket" />
                </div>
                <label class="checkboxContainer">
                    <input is="emby-checkbox" type="checkbox" id="enableSpotifyLookup" />
                    <span>Aktiviert</span>
                </label>
                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block"><span>Speichern</span></button>
                </div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        (function () {
            'use strict';
            var pluginId = '67de1daa-c9fe-497a-9ca2-dc303abb717b';
            document.querySelector('#spotifyConfigPage').addEventListener('pageshow', function () {
                window.Dashboard.showLoadingMsg();
                window.ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                    document.querySelector('#spotifyClientId').value = config.ClientId || '';
                    document.querySelector('#spotifyClientSecret').value = config.ClientSecret || '';
                    document.querySelector('#spotifyMarket').value = config.Market || 'DE';
                    document.querySelector('#enableSpotifyLookup').checked = config.EnableImageLookup !== false;
                    window.Dashboard.hideLoadingMsg();
                });
            });
            document.querySelector('#spotifyConfigForm').addEventListener('submit', function (e) {
                e.preventDefault();
                window.Dashboard.showLoadingMsg();
                window.ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                    config.ClientId = document.querySelector('#spotifyClientId').value;
                    config.ClientSecret = document.querySelector('#spotifyClientSecret').value;
                    config.Market = document.querySelector('#spotifyMarket').value;
                    config.EnableImageLookup = document.querySelector('#enableSpotifyLookup').checked;
                    window.ApiClient.updatePluginConfiguration(pluginId, config).then(function () {
                        window.Dashboard.hideLoadingMsg();
                        window.Dashboard.alert('Gespeichert.');
                    });
                });
                return false;
            });
        })();
    </script>
</div>
</body>
</html>
