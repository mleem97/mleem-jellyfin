<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="mt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FFC107" />
    </linearGradient>
    <filter id="mt-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="90" height="90" x="5" y="5" rx="18" fill="url(#mt-grad)" filter="url(#mt-shadow)" />
  <!-- Clapperboard Top -->
  <path d="M22 28 L78 28 L74 40 L18 40 Z" fill="#212121" />
  <polygon points="26,28 32,28 28,40 22,40" fill="#FFFFFF" opacity="0.9" />
  <polygon points="40,28 46,28 42,40 36,40" fill="#FFFFFF" opacity="0.9" />
  <polygon points="54,28 60,28 56,40 50,40" fill="#FFFFFF" opacity="0.9" />
  <polygon points="68,28 74,28 70,40 64,40" fill="#FFFFFF" opacity="0.9" />
  <!-- Clapperboard Body -->
  <rect x="22" y="42" width="56" height="38" rx="4" fill="#212121" opacity="0.95" />
  <!-- Gear / Tool Emblem inside Clapperboard -->
  <circle cx="50" cy="61" r="14" fill="none" stroke="#FF9800" stroke-width="4" stroke-dasharray="6,3" />
  <circle cx="50" cy="61" r="7" fill="#FFFFFF" />
  <circle cx="50" cy="61" r="3" fill="#212121" />
  <!-- Small Wrench Accent in bottom right -->
  <circle cx="68" cy="71" r="6" fill="#00BCD4" />
  <path d="M66 69 L70 73 M70 69 L66 73" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
