<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2be2"/>
      <stop offset="50%" stop-color="#4a00e0"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg-grad)" filter="url(#drop-shadow)"/>
  <rect x="8" y="8" width="112" height="56" rx="28" fill="url(#glow-grad)"/>

  <!-- Border Highlight -->
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Central Metadata Tag & Audio Graphic -->
  <g transform="translate(26, 26)" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Tag boundary / badge -->
    <path d="M4 14 C4 8.477 8.477 4 14 4 L42 4 L72 34 L42 64 L14 64 C8.477 64 4 59.523 4 54 Z" fill="rgba(255, 255, 255, 0.08)"/>
    <!-- Tag eyelet -->
    <circle cx="20" cy="20" r="4.5" fill="#ffffff" stroke="none"/>
    
    <!-- Music note & metadata wave inside -->
    <path d="M42 22 L42 44" stroke="#ffffff" stroke-width="4"/>
    <path d="M42 24 L58 18 L58 38" stroke="#ffffff" stroke-width="4"/>
    <circle cx="36" cy="46" r="6" fill="#ffffff" stroke="none"/>
    <circle cx="52" cy="40" r="6" fill="#ffffff" stroke="none"/>
    
    <!-- Checkmark / sync spark -->
    <path d="M12 48 L18 54 L30 40" stroke="#00ffcc" stroke-width="3.5"/>
  </g>
</svg>
