<!DOCTYPE html>
<html>
<head>
    <title>Music Dashboard</title>
    <style>
        .music-dashboard-card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 1.25rem; margin: 1rem 0; }
        .music-dashboard-muted { color: #aaa; }
        .music-dashboard-path { font-family: monospace; word-break: break-all; }
    </style>
</head>
<body>
    <div id="MusicDashboardConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
        <div data-role="content">
            <div class="content-primary">
                <h1>Music Dashboard</h1>
                <p class="music-dashboard-muted">Music library overview for Jellyfin.</p>
                <div class="music-dashboard-card">
                    <h2>Overview</h2>
                    <div id="musicDashboardStatus" class="music-dashboard-muted">Loading...</div>
                    <div id="musicDashboardLibraries"></div>
                </div>
            </div>
        </div>
        <script>
            (function () {
                function getJson(url) {
                    if (window.ApiClient && ApiClient.getJSON && ApiClient.getUrl) {
                        return ApiClient.getJSON(ApiClient.getUrl(url));
                    }

                    return fetch(url).then(function (response) {
                        if (!response.ok) throw new Error('HTTP ' + response.status);
                        return response.json();
                    });
                }

                function render(data) {
                    var status = document.querySelector('#musicDashboardStatus');
                    var container = document.querySelector('#musicDashboardLibraries');
                    var libraries = data.libraries || [];
                    status.textContent = (data.musicLibraryCount || 0) + ' music libraries, ' + (data.musicPathCount || 0) + ' paths';
                    container.innerHTML = libraries.map(function (library) {
                        var paths = (library.paths || []).map(function (path) {
                            return '<li class="music-dashboard-path">' + path + '</li>';
                        }).join('');
                        return '<div class="music-dashboard-card"><h3>' + library.name + '</h3><ul>' + paths + '</ul></div>';
                    }).join('') || '<p class="music-dashboard-muted">No music libraries found.</p>';
                }

                function load() {
                    getJson('Plugins/MusicDashboard/Overview')
                        .then(render)
                        .catch(function (error) {
                            document.querySelector('#musicDashboardStatus').textContent = 'Failed to load music overview: ' + error.message;
                        });
                }

                document.querySelector('#MusicDashboardConfigPage').addEventListener('pageshow', load);
            })();
        </script>
    </div>
</body>
</html>
