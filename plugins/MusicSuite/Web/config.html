<!DOCTYPE html>
<html>
<head>
    <title>MusicSuite</title>
</head>
<body>
    <div id="MusicSuiteConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
        <div data-role="content">
            <div class="content-primary">
                <h1>MusicSuite</h1>
                <p>Enhanced Jellyfin music UI with endless scroll, live search and per-user layouts.</p>
                <div class="paperList" style="padding:1rem">
                    <h2>Status</h2>
                    <div id="musicSuiteStatus">Loading...</div>
                </div>
            </div>
        </div>
        <script>
            (function () {
                function getJson(url) {
                    if (window.ApiClient && ApiClient.getJSON && ApiClient.getUrl) {
                        return ApiClient.getJSON(ApiClient.getUrl(url));
                    }
                    return fetch(url).then(function (response) {
                        if (!response.ok) throw new Error('HTTP ' + response.status);
                        return response.json();
                    });
                }

                function load() {
                    getJson('Plugins/MusicSuite/Overview').then(function (data) {
                        document.querySelector('#musicSuiteStatus').textContent = data.libraryCount + ' music libraries detected.';
                    }).catch(function (error) {
                        document.querySelector('#musicSuiteStatus').textContent = 'Failed to load status: ' + error.message;
                    });
                }

                document.querySelector('#MusicSuiteConfigPage').addEventListener('pageshow', load);
            })();
        </script>
    </div>
</body>
</html>
