  <circle cx="31" cy="32" r="3" fill="#00a4dc" />
  <path d="M23.5 35 L23.5 24 C 23.5 24, 28 22, 34 23 L34 32" stroke="url(#ms-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
