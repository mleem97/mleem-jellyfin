<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Gracenote Metadata Provider</title>
</head>
<body>
<div id="gracenoteConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <h2>Gracenote Metadata Provider</h2>
            <form id="gracenoteConfigForm">
                <div class="inputContainer">
                    <label class="inputLabel" for="gracenoteClientId">Gracenote Client-ID</label>
                    <input is="emby-input" type="text" id="gracenoteClientId" />
                    <div class="fieldDescription">MusicID CLIENT. Die User-ID wird automatisch registriert.</div>
                </div>
                <label class="checkboxContainer">
                    <input is="emby-checkbox" type="checkbox" id="enableGracenote" />
                    <span>Aktiviert</span>
                </label>
                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block"><span>Speichern</span></button>
                </div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        (function () {
            'use strict';
            var pluginId = 'a05dae4a-2e92-4303-8f16-a7ade62624b4';
            document.querySelector('#gracenoteConfigPage').addEventListener('pageshow', function () {
                window.Dashboard.showLoadingMsg();
                window.ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                    document.querySelector('#gracenoteClientId').value = config.GracenoteClientId || '';
                    document.querySelector('#enableGracenote').checked = config.EnableGracenote !== false;
                    window.Dashboard.hideLoadingMsg();
                });
            });
            document.querySelector('#gracenoteConfigForm').addEventListener('submit', function (e) {
                e.preventDefault();
                window.Dashboard.showLoadingMsg();
                window.ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                    config.GracenoteClientId = document.querySelector('#gracenoteClientId').value;
                    config.EnableGracenote = document.querySelector('#enableGracenote').checked;
                    window.ApiClient.updatePluginConfiguration(pluginId, config).then(function () {
                        window.Dashboard.hideLoadingMsg();
                        window.Dashboard.alert('Gespeichert.');
                    });
                });
                return false;
            });
        })();
    </script>
</div>
</body>
</html>
